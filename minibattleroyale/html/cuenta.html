
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Battle Royale - Cuenta</title>

    <link rel="stylesheet" href="../estilos/cuenta.css">
</head>

<body>

    <main class="contenedor">

        <h1>MINI BATTLE ROYALE</h1>
        <p class="subtitulo">¡Prepárate para sobrevivir!</p>

        <div class="pestanas">
            <button id="mostrarLogin" class="activo">
                Iniciar sesión
            </button>

            <button id="mostrarRegistro">
                Registrarse
            </button>
        </div>

        <!-- INICIO DE SESIÓN -->

        <form id="formularioLogin">

            <h2>Bienvenido de nuevo</h2>

            <label>Correo electrónico</label>

            <input
                type="email"
                id="correoLogin"
                placeholder="Ingresa tu correo"
                required
            >

            <label>Contraseña</label>

            <input
                type="password"
                id="claveLogin"
                placeholder="Ingresa tu contraseña"
                required
            >

            <button type="submit" class="botonPrincipal">
                ENTRAR AL JUEGO
            </button>

        </form>

        <!-- REGISTRO -->

        <form id="formularioRegistro" class="oculto">

            <h2>Crear una cuenta</h2>

            <label>Nombre de jugador</label>

            <input
                type="text"
                id="nombreRegistro"
                placeholder="Tu nombre de jugador"
                maxlength="30"
                required
            >

            <label>Correo electrónico</label>

            <input
                type="email"
                id="correoRegistro"
                placeholder="Tu correo electrónico"
                required
            >

            <label>Contraseña</label>

            <input
                type="password"
                id="claveRegistro"
                placeholder="Mínimo 8 caracteres"
                minlength="8"
                required
            >

            <label>Confirmar contraseña</label>

            <input
                type="password"
                id="confirmarClave"
                placeholder="Repite tu contraseña"
                minlength="8"
                required
            >

            <button type="submit" class="botonPrincipal">
                CREAR CUENTA
            </button>

        </form>

        <p id="mensaje"></p>

    </main>

    <script src="../javascript/cuenta.js"></script>
</body>
</html>
