<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Battle Royale</title>

    <link rel="stylesheet" href="../estilos/estilo.css">
</head>

<body>

    <h1>MINI BATTLE ROYALE</h1>

    <div id="informacion">

        <span id="vida">❤️ Vida: 100</span>

        <span id="municion">🔫 Balas: 12 / 60</span>

        <span id="enemigos">👥 Enemigos: 10</span>

        <span id="bajas">☠️ Bajas: 0</span>

    </div>

    <div id="contenedor">

        <canvas id="juego" width="900" height="560"></canvas>

        <div id="pantalla">

            <h2 id="titulo">MINI BATTLE ROYALE</h2>

            <p id="mensaje">
                Sobrevive y elimina a todos los enemigos.
            </p>

            <button id="botonJugar">JUGAR</button>

        </div>

    </div>

    <p id="controles">
        WASD: Moverse | Mouse: Apuntar |
        Clic: Disparar | R: Recargar
    </p>

    <script type="module" src="../javascript/acceso.js"></script>

</body>

</html>
